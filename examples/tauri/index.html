<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>afm-bridge Tauri example</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>On-device model</h1>
      <p id="status">Checking availability…</p>
    </header>
    <main id="log" aria-live="polite"></main>
    <form id="form">
      <textarea id="prompt" rows="3" placeholder="Ask something (Enter sends, Shift+Enter adds a line)"></textarea>
      <div class="actions">
        <button type="button" id="reset">New conversation</button>
        <button type="button" id="stop" disabled>Stop</button>
        <button type="submit" id="send" disabled>Send</button>
      </div>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
